# cupsd for the demo container: local only, no authentication, and permissive
# enough that the administrative keys in the recording go through without a
# password prompt. Nothing here is meant for a machine anyone prints from.

LogLevel info
MaxLogSize 0
Listen localhost:631
Listen /run/cups/cups.sock
Browsing Off
DefaultAuthType None
WebInterface No

<Location />
  Order allow,deny
  Allow localhost
</Location>

<Location /admin>
  Order allow,deny
  Allow localhost
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow localhost
</Location>

<Policy default>
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess all
  SubscriptionPrivateValues none

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
