name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token is read-only: nothing here writes to the repository, and a
# pull request from a fork must not be able to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -s would change:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # install.sh is the first thing anyone runs, and it is the one piece
      # here the Go suite cannot cover.
      - name: Shell scripts
        run: shellcheck scripts/*.sh

      # The suite runs without CUPS: the one test that needs a live daemon
      # skips itself when it cannot reach one.
      - name: Test
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" ./cmd/cupstui

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
